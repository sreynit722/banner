<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSPP</title>
    <link rel="icon" type="image/png" href="./icon-cspp.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* CSS Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Kantumruy Pro", sans-serif;
            line-height: 2;
        }

        :root {
            --primary: #2563EB;
            --secondary: #60A5FA;
            --accent: #FFFFFF;
            --bg-1: #020617;
            --bg-2: #0F172A;
            --bg-3: #1E3A8A;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-1);
            color: var(--accent);
            overflow-x: hidden;
            height: 100vh;
        }

        /* Animated Gradient Background */
        .background-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
            background-size: 300% 300%;
            animation: gradientShift 15s ease infinite;
            z-index: -3;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Floating Blurred Circles */
        .blur-circle {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -2;
            opacity: 0.4;
            animation: floatCircle 10s ease-in-out infinite alternate;
        }

        .circle-1 {
            width: 350px;
            height: 350px;
            background: var(--primary);
            top: -100px;
            left: -100px;
        }

        .circle-2 {
            width: 450px;
            height: 450px;
            background: var(--secondary);
            bottom: -150px;
            right: -150px;
            animation-delay: -5s;
        }

        @keyframes floatCircle {
            0% {
                transform: translateY(0) scale(1);
            }

            100% {
                transform: translateY(40px) scale(1.1);
            }
        }

        /* CSS-only Glowing Animated Dots */
        .dots-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .dot {
            position: absolute;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--secondary);
            animation: floatDot linear infinite;
        }

        /* Generate individual randomized dot properties inline or via basic styling structure */
        @keyframes floatDot {
            0% {
                transform: translateY(100vh) scale(0.8);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            80% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        /* Hero Section Layout */
        .hero-section {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            text-align: center;
        }

        .hero-content img {
            height: 120px;
            margin-top: -100px;
            margin-bottom: 100px;
        }

        @keyframes heroEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Typography Styling */
        .hero-title {
            font-size: clamp(40px, 6vw, 72px);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
            color: var(--accent);
            text-shadow: 0 0 25px rgba(96, 165, 250, 0.5);
        }

        .hero-title span {
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: clamp(16px, 2vw, 20px);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.8);
            max-width: 750px;
            margin: 0 auto 40px auto;
            line-height: 1.6;
        }

        /* Call-To-Action Button */
        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 36px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.5);
            transition: all 0.3s ease;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(96, 165, 250, 0.8);
        }

        .cta-button:hover::before {
            left: 100%;
        }

        /* Fullscreen Toggle Floating Button */
        .fullscreen-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--accent);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            z-index: 999;
        }

        .fullscreen-btn:hover {
            transform: scale(1.1);
            background: var(--primary);
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.6);
        }

        .fullscreen-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .hero-content {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>


    <div class="background-gradient"></div>

    <div class="blur-circle circle-1"></div>
    <div class="blur-circle circle-2"></div>

    <div class="dots-container" id="dotsContainer"></div>

    <!-- Fullscreen Toggle Button -->
    <button class="fullscreen-btn" id="fullscreenToggle" title="Toggle Fullscreen">
        <svg id="fsIcon" viewBox="0 0 24 24">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
        </svg>
    </button>

    <!-- Main Hero Section -->
    <main class="hero-section">
        <div class="hero-content">
            <img src="./cspp-logo.png" alt="logo">
            <h1 class="hero-title">ការធ្វើបទបង្ហាញស្នាដៃសិស្សថ្នាក់ទី១១ <br><span>ការបង្កើតគេហទំព័រ</span></h1>
            <p class="hero-subtitle">គោលបំណងសំខាន់នៃគម្រោងនេះ
                គឺដើម្បីអនុវត្តទ្រឹស្តីដែលបានរៀនក្នុងថ្នាក់ឱ្យក្លាយជាលទ្ធផលជាក់ស្តែង ពង្រឹងកិច្ចសហការក្នុងក្រុម
                និងបង្កើនជំនាញដោះស្រាយបញ្ហាផ្នែកបច្ចេកវិទ្យា។</p>
            <a href="./info.html" class="cta-button">Date: 31 July 2026</a>
        </div>
    </main>

    <!-- JavaScript to programmatically inject custom animated background dots and handle Fullscreen -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("dotsContainer");
            const numberOfDots = 35;

            for (let i = 0; i < numberOfDots; i++) {
                const dot = document.createElement("div");
                dot.classList.add("dot");

                // Random positioning and distinct animation parameters
                const size = Math.random() * 4 + 2; // size between 2px and 6px
                const leftPos = Math.random() * 100; // horizontal percentage
                const duration = Math.random() * 8 + 6; // duration between 6s and 14s
                const delay = Math.random() * 5; // stagger delay

                dot.style.width = `${size}px`;
                dot.style.height = `${size}px`;
                dot.style.left = `${leftPos}%`;
                dot.style.animationDuration = `${duration}s`;
                dot.style.animationDelay = `-${delay}s`;

                container.appendChild(dot);
            }

            // Fullscreen Toggle Functionality
            const fullscreenToggle = document.getElementById("fullscreenToggle");
            const fsIcon = document.getElementById("fsIcon");

            const expandIconPath = "M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z";
            const compressIconPath = "M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z";

            fullscreenToggle.addEventListener("click", () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.error(`Error attempting to enable fullscreen: ${err.message}`);
                    });
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            });

            document.addEventListener("fullscreenchange", () => {
                const pathElement = fsIcon.querySelector("path");
                if (document.fullscreenElement) {
                    pathElement.setAttribute("d", compressIconPath);
                    fullscreenToggle.setAttribute("title", "Exit Fullscreen");
                } else {
                    pathElement.setAttribute("d", expandIconPath);
                    fullscreenToggle.setAttribute("title", "Toggle Fullscreen");
                }
            });
        });
    </script>
</body>

</html>
